# App lives at /srv/work/plain/asifahmed.tech and listens on 127.0.0.1:8500
# Copy to /etc/nginx/sites-available/asifahmed.tech
# then: sudo ln -sf /etc/nginx/sites-available/asifahmed.tech /etc/nginx/sites-enabled/
# After DNS works, run: sudo certbot --nginx -d asifahmed.tech -d www.asifahmed.tech

upstream asifahmed {
    server 127.0.0.1:8500;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name asifahmed.tech www.asifahmed.tech;

    client_max_body_size 10m;

    location / {
        proxy_pass http://asifahmed;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
