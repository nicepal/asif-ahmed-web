# asifahmed.tech
# Public HTTP: 8500 (VPS range 8500-8900)
# Node/PM2:    127.0.0.1:8520 (localhost only)

map $http_x_forwarded_proto $asifahmed_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream asifahmed {
    server 127.0.0.1:8520;
    keepalive 32;
}

server {
    listen 8500;
    listen [::]:8500;
    server_name asifahmed.tech www.asifahmed.tech;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://asifahmed;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $asifahmed_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
