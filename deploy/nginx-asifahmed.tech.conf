# Public HTTP on 8500 (provider allows 8500-8900; 80/443 are blocked).
# Node/PM2 listens on 127.0.0.1:8501.
# Open 8500 in the VPS panel firewall and ufw, then visit http://asifahmed.tech:8500

upstream asifahmed {
    server 127.0.0.1:8501;
    keepalive 32;
}

server {
    listen 8500;
    listen [::]:8500;
    server_name asifahmed.tech www.asifahmed.tech;

    client_max_body_size 10m;

    location / {
        proxy_pass http://asifahmed;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
